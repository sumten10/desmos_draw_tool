<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://www.desmos.com/api/v1.11/calculator.js?apiKey=api_key"></script>
  <link rel="stylesheet" href="stylesheet.css">

</head>
<body>
  <div id="top_bar">
    <input type="text" name="graph-name" id="name-container">
    <button id="load-button">Load</button>
    <button id="save-button">Save</button>
    <div id="line-size-container">
      <p>Width</p>
      <input type="number" id="line-size" value="2.5">
    </div>

    <div id="opacity-container">
      <p>Opacity</p>
      <input type="number" id="line-opacity" value="1.0", step="0.1">
    </div>
  </div>
  <div id="calculator"></div>
  <script src="script.js"></script>

</body>
</html>
